<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trending Store Inventario</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<style>
:root{
  /* Negro y dorado de la marca Trending Store. Una sola apariencia oscura para que el logo blanco luzca. */
  /* Layout: barra superior con logo, contenido en tarjetas, barra de pestañas abajo en el celular. */
  --bg:#0A0A0B;
  --surface:#141416;
  --surface-2:#1C1C20;
  --line:#2B2B30;
  --ink:#F3EFE6;
  --muted:#9C978C;
  --gold:#D49E2C;
  --gold-2:#F0C565;
  --gold-soft:rgba(212,158,44,.14);
  --good:#4BC489; --good-soft:rgba(75,196,137,.14);
  --bad:#EF6B6B;  --bad-soft:rgba(239,107,107,.14);
  --warn:#F09A4A; --warn-soft:rgba(240,154,74,.15);
  --font-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.grow{flex:1}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Top bar */
header.top{position:sticky;top:0;z-index:30;background:rgba(10,10,11,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{height:30px;width:auto}
.brand span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
nav.tabs{display:flex;gap:2px;margin-left:auto}
nav.tabs a{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
nav.tabs a:hover{color:var(--ink);background:var(--surface)}
nav.tabs a[aria-current="page"]{color:var(--gold);background:var(--gold-soft)}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.wait{background:var(--warn)} .dot.off{background:var(--bad)}
@media (max-width:820px){
  header.top{backdrop-filter:none;background:var(--bg)}
  .toolbar select{flex:1 1 140px}
  .top-in{padding:10px 16px}
  .brand img{height:24px}
  .brand span{display:none}
  .status{margin-left:auto}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.tabs a{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;flex:1;text-align:center}
  main{padding-bottom:90px!important}
}
.banner{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);font-size:13.5px}
.banner div{max-width:1200px;margin:0 auto;padding:8px 20px}

main{max-width:1200px;margin:0 auto;padding:22px 20px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:800;font-style:italic;font-stretch:112%;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700;font-stretch:105%}
h3{font-size:15px;font-weight:700}
.page-h{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.page-h .grow{min-width:8px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

/* Buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:40px}
.btn:hover{border-color:#44444b}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#121212}
.btn.primary:hover{background:var(--gold-2)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(239,107,107,.35);background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
.icon-btn:disabled{opacity:.3;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lbl{font-size:12.5px;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:40px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
input[type="checkbox"],input[type="radio"]{width:auto;min-height:0;accent-color:var(--gold)}
textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.row3,.row4{grid-template-columns:1fr 1fr}}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--gold)}
.per{display:flex;gap:8px;flex-wrap:wrap}
.per select{width:auto;min-width:96px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--font-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:linear-gradient(160deg,rgba(212,158,44,.22),rgba(212,158,44,.06));border-color:rgba(212,158,44,.45)}
.kpi.hero .v{color:var(--gold-2)}
.quick{display:flex;flex-wrap:wrap;gap:8px}

/* Chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;cursor:pointer}
.li:first-child{border-top:0}
button.li:hover{background:var(--surface-2)}
.li .t{font-weight:600}
.li .m{font-size:12.5px;color:var(--muted)}
.li .r{margin-left:auto;text-align:right;flex:none}
.thumb{width:44px;height:52px;border-radius:8px;background:var(--surface-2);overflow:hidden;flex:none;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph-mono{width:22px;opacity:.35}
.day-h{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;padding:14px 4px 4px}

/* Inventory grid */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type="search"]{flex:1;min-width:200px}
.toolbar select{width:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
@media (max-width:520px){.pgrid{grid-template-columns:1fr 1fr;gap:10px}}
.pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;cursor:pointer;color:inherit}
.pcard:hover{border-color:rgba(212,158,44,.55)}
.pcard .ph{aspect-ratio:4/5;background:var(--surface-2);position:relative;display:grid;place-items:center}
.pcard .ph img.photo{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pcard .ph .ph-mono{width:56px;opacity:.22}
.pcard .ph .add{position:absolute;bottom:8px;left:8px;font-size:11.5px;color:var(--muted);display:flex;gap:4px;align-items:center}
.pcard .tag{position:absolute;top:8px;left:8px}
.pcard .size{position:absolute;top:8px;right:8px;background:rgba(10,10,11,.8);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-weight:800;font-size:13px}
.pcard .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.pcard .brand-t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.pcard .name{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .price{font-family:var(--font-display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.pcard .meta{font-size:12px;color:var(--muted)}
.pcard.sold .ph img.photo,.pcard.sold .ph .ph-mono{opacity:.35}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
/* Editable lot grid */
.egrid td{padding:4px}
.egrid input{min-height:34px;padding:6px 8px;border-radius:8px;font-size:13.5px}
.egrid .w-marca{min-width:120px}.egrid .w-art{min-width:220px}.egrid .w-ref{min-width:100px}.egrid .w-talla{width:70px}.egrid .w-cant{width:58px}.egrid .w-usd{width:84px}.egrid .w-desc{width:62px}.egrid .w-precio{width:116px}
.lphoto{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;border:1px dashed var(--line);background:var(--bg);color:var(--muted);cursor:pointer;overflow:hidden}
.lphoto:hover{border-color:var(--gold);color:var(--gold)}
.lphoto img{width:100%;height:100%;object-fit:cover}
.egrid td.calc{font-size:12.5px;white-space:nowrap;padding:4px 8px}

/* Modals */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);width:100%;max-width:600px;max-height:94%;display:flex;flex-direction:column;border-radius:18px 18px 0 0}
.sheet.wide{max-width:980px}
.sheet.xwide{max-width:1180px}
@media (min-width:821px){.overlay{align-items:center;padding:24px}.sheet{border-radius:18px;max-height:100%}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 12px 20px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1}
.sheet-b{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet-b>*{flex-shrink:0}
.sheet-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:6px}
.sub{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:800;font-family:var(--font-body)}
.calc-box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.calc-box div{display:flex;flex-direction:column;gap:2px}
.calc-box span{font-size:12px;color:var(--muted)}
.calc-box b{font-family:var(--font-display);font-size:17px;font-variant-numeric:tabular-nums}
.photo-box{aspect-ratio:4/5;background:var(--surface-2);border-radius:12px;overflow:hidden;display:grid;place-items:center;border:1px dashed var(--line)}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-box .ph-mono{width:60px;opacity:.25}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs button{width:48px;height:58px;border-radius:8px;overflow:hidden;border:2px solid var(--line);padding:0;background:var(--surface-2);cursor:pointer}
.thumbs button[aria-pressed="true"]{border-color:var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pcard .nfotos{position:absolute;bottom:8px;right:8px;display:flex;align-items:center;gap:3px;background:rgba(10,10,11,.8);border:1px solid var(--line);border-radius:8px;padding:2px 7px;font-size:12px;font-weight:700}
.pcard .nfotos svg.i{width:14px;height:14px}
.lphoto{position:relative}.lp-n{position:absolute;bottom:0;right:0;background:var(--gold);color:#111;font-size:10px;font-weight:800;padding:0 3px;border-radius:4px 0 0 0}
.item-form{display:grid;grid-template-columns:200px 1fr;gap:18px}
@media (max-width:620px){.item-form{grid-template-columns:1fr}.item-form .photo-col{max-width:220px}}
.vm{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
@media (max-width:820px){.vm{grid-template-columns:1fr}}
.vm-list{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.cart-line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.cart-line:first-child{border-top:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{width:32px;height:32px;border:0;background:var(--surface-2);cursor:pointer}
.stepper span{min-width:30px;text-align:center;font-weight:700}
.tot{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tot div{display:flex;justify-content:space-between;gap:12px}
.tot .big{font-family:var(--font-display);font-size:22px;font-weight:800}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-row label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:600;flex:1;min-width:150px}
.radio-row label:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}

/* Invoice preview */
.factura{background:#fff;color:#141414;border-radius:12px;overflow:hidden;font-size:13.5px}
.factura .fh{background:#0A0A0B;padding:18px 22px;display:flex;align-items:center;gap:16px}
.factura .fh img{height:34px;width:auto}
.factura .fh .fnum{margin-left:auto;text-align:right;color:#F3EFE6;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.factura .fh .fnum b{display:block;color:#D49E2C;font-family:var(--font-display);font-size:22px;letter-spacing:0}
.factura .fb{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.factura .fcli{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px}
.factura .fcli span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7a756b}
.factura table{width:100%;border-collapse:collapse}
.factura th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7a756b;text-align:left;border-bottom:2px solid #141414;padding:6px 4px}
.factura td{padding:7px 4px;border-bottom:1px solid #e5e1d8}
.factura .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.factura .ftot{margin-left:auto;min-width:260px;display:flex;flex-direction:column;gap:4px}
.factura .ftot div{display:flex;justify-content:space-between;gap:20px}
.factura .ftot .g{font-weight:800;font-size:16px;border-top:2px solid #141414;padding-top:6px}
.factura .ftot .p{color:#b0262e;font-weight:800}
.factura .ff{background:#f4f1ea;padding:12px 22px;font-size:12px;color:#5b574f;display:flex;flex-wrap:wrap;gap:6px 18px}

/* Toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
@media (max-width:820px){#toasts{bottom:96px}}
.toast{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--gold);padding:10px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:600;width:100%}
.toast.good{border-left-color:var(--good)} .toast.bad{border-left-color:var(--bad)}
.empty{text-align:center;padding:34px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty img{width:54px;opacity:.5}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;counter-reset:s}
.steps div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.steps b{display:block;margin-bottom:4px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.lote-card{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;color:inherit}
.lote-card:hover{border-color:rgba(212,158,44,.55)}
.lote-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lote-stats span{display:block;font-size:11.5px;color:var(--muted)}
.lote-stats b{font-variant-numeric:tabular-nums}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.auth{max-width:400px;width:100%;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px;align-items:stretch}
.auth>img{width:220px;margin:0 auto}.auth h1{text-align:center}
#render-zone{position:fixed;left:-12000px;top:0;width:760px}
</style>
</head>
<body>
<div class="app">

  lotes.forEach((l,li)=>{(l.items||[]).forEach((it,ii)=>{
    const key=l.id+'|'+it.id;const vApp=vend.get(key)||0;
    const stock=(+it.cant||0)-(+it.prevVend||0)-vApp;

  D.tallas=[...new Set(items.map(i=>i.talla).filter(Boolean))].sort((a,b)=>{const ia=TALLAS.indexOf(a),ib=TALLAS.indexOf(b);return(ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b,'es',{numeric:true})});

function calcLote(l,items){
  const dolar=parseNum(l.dolar),imp=parseNum(l.impPct)/100;
  const envioCOP=(l.envioMon==='USD'?parseNum(l.envio)*dolar:parseNum(l.envio))||0;
  const otros=parseNum(l.otrosCOP)||0;const extras=envioCOP+otros;
  const rows=items.map(it=>{const u=parseNum(it.usd),d=parseNum(it.desc)/100,c=Math.max(0,Math.round(parseNum(it.cant)));return{u,neto:u*(1-d),c}});
  const totNeto=sum(rows,r=>r.neto*r.c),uni=sum(rows,r=>r.c);
  const costos=rows.map(r=>{let ex=0;if(extras>0){if(l.reparto==='igual')ex=uni?extras/uni:0;else ex=totNeto>0?extras*r.neto/totNeto:(uni?extras/uni:0)}return Math.round(r.neto*(1+imp)*dolar+ex)});
  return{dolar,imp,envioCOP,otros,extras,totNeto,uni,costos,merc:totNeto*(1+imp)*dolar,total:sum(costos.map((c,i)=>c*rows[i].c),x=>x)};
}

function periodo(){
  const ventas=S.ventas.filter(v=>inPer(v.fecha));
  const mov=D.mov.filter(m=>inPer(m.fecha));
  const ing=sum(ventas,v=>v.total),costo=sum(ventas,v=>v.costo);
  const gastos=sum(mov.filter(m=>m.tipo==='salida'&&!m.auto&&GASTO_CATS.has(m.cat)),m=>m.monto);
  const lotes=S.lotes.filter(l=>inPer(l.fecha));
  return{ventas,mov,ing,costo,bruta:ing-costo,gastos,neta:ing-costo-gastos,
    entra:sum(mov.filter(m=>m.tipo==='entrada'),m=>m.monto),sale:sum(mov.filter(m=>m.tipo==='salida'),m=>m.monto),
    invertido:sum(lotes,l=>l.totalCOP),lotes,unidades:sum(ventas,v=>sum(v.items||[],i=>i.cant))};
}

function niceStep(x){if(x<=0)return 1;const e=Math.floor(Math.log10(x)),f=x/10**e;return(f<=1?1:f<=2?2:f<=5?5:10)*10**e}
function chartSVG({labels,a,b,every}){
  const W=640,H=240,pl=58,pr=8,pt=10,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const mx=Math.max(0,...a,...b),mn=Math.min(0,...a,...b);
  const step=niceStep((mx-mn||1)/4),lo=Math.floor(mn/step)*step,hi=Math.max(step,Math.ceil(mx/step)*step);
  const y=v=>pt+ih-(v-lo)/(hi-lo)*ih;
  const n=labels.length,bw=iw/n,w=Math.max(2,Math.min(16,(bw-3)/2));
  let g='';
  for(let t=lo;t<=hi+step/2;t+=step){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${copS(t)}</text>`}
  let bars='';
  labels.forEach((lab,i)=>{
    const x0=pl+i*bw+(bw-2*w-2)/2;
    const r=(v,x,c)=>{const y1=y(Math.max(v,0)),y2=y(Math.min(v,0));return v?`<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1,y2-y1).toFixed(1)}" rx="2" fill="${c}"><title>${lab}: ${cop(v)}</title></rect>`:''};
    bars+=r(a[i],x0,'var(--gold)')+r(b[i],x0+w+2,'var(--good)');
    if(i%every===0||every===1)bars+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${lab}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas y ganancia del periodo">${g}${bars}</svg>`;
}

function invFiltered(ignorarEstado){
  const f=ignorarEstado?{...S.inv,estado:'todas'}:S.inv,q=norm(f.q);
  let it=D.items.filter(i=>{
    if(f.estado==='disp'&&i.stock<=0)return false;
    if(f.estado==='vend'&&i.stock>0)return false;
    if(f.lote&&i.loteId!==f.lote)return false;
    if(f.marca&&i.marca!==f.marca)return false;
    if(f.talla&&i.talla!==f.talla)return false;
    if(q&&!norm(`${i.marca} ${i.articulo} ${i.ref} ${i.talla} ${i.loteNombre}`).includes(q))return false;
    return true;
  });
  const o=f.orden;
  it.sort(o==='precio'?(a,b)=>(b.precio||0)-(a.precio||0):o==='marca'?(a,b)=>a.marca.localeCompare(b.marca)||a.articulo.localeCompare(b.articulo):o==='ganancia'?(a,b)=>((b.precio||0)-(b.costo||0))-((a.precio||0)-(a.costo||0)):(a,b)=>a.ord-b.ord);
  return it;
}

function loteStats(l){
  let uni=0,vend=0,vendido=0;
  for(const it of l.items||[]){uni+=+it.cant||0;vend+=(+it.prevVend||0)+(D.vend.get(l.id+'|'+it.id)||0)}
  for(const v of S.ventas)for(const it of v.items||[])if(it.loteId===l.id)vendido+=it.cant*it.precio;
  const prevVal=sum(l.items||[],it=>(+it.prevVend||0)*(+it.precio||0));
  const recuperado=vendido+prevVal;
  return{uni,vend,disp:uni-vend,recuperado,inv:+l.totalCOP||0,ventaTotal:sum(l.items||[],it=>(+it.cant||0)*(+it.precio||0))};
}

async function importJson(file){
  if(!canWrite())return;
  let j;try{j=JSON.parse(await file.text())}catch(e){toast('Ese archivo no es una copia válida (.json).','bad');return}
  const rows=[];const clean=d=>{if(d&&Array.isArray(d.items))d.items.forEach(it=>{if(it.foto&&!String(it.foto).includes('/'))delete it.foto});return d};
  if(Array.isArray(j))for(const x of j){if(x&&x.id&&x.data)rows.push({collection:'lotes',id:String(x.id),data:clean(x.data)})}
  else if(j&&typeof j==='object'){for(const c of ['lotes','ventas','caja'])for(const d of (j[c]||[])){const{id,...data}=d;if(id)rows.push({collection:c,id:String(id),data:clean(data)})}
    if(j.config&&Object.keys(j.config).length)rows.push({collection:'config',id:'general',data:{...j.config,...S.config,importado:true}})}
  if(!rows.length){toast('No encontré datos para importar en ese archivo.','bad');return}
  const n=c=>rows.filter(r=>r.collection===c).length;
  if(!(await confirmBox(`Se van a importar <b>${n('lotes')} lotes</b>, <b>${n('ventas')} ventas</b> y <b>${n('caja')} movimientos de caja</b>. Si ya existe algo con el mismo código, se reemplaza.`,'Importar',false)))return;
  try{
    for(let i=0;i<rows.length;i+=200){const{error}=await sb.from('docs').upsert(rows.slice(i,i+200).map(r=>({...r,updated_at:new Date().toISOString()})));if(error)throw error}
    if(!rows.some(r=>r.collection==='config'))await saveConfig({importado:true});
    await loadAll();toast(`Listo: ${n('lotes')} lotes importados`,'good');
  }catch(e){console.error(e);toast('No se pudo importar: '+(e.message||'revisa tu internet'),'bad')}
}

function marcaMasivaModal(){
  const items=invFiltered(true);if(!items.length)return;
  const sel=new Set(items.map(i=>i.key));let nueva='',ventasTambien=true,busy=false;
  const m=openModal('Cambiar marca de varias prendas','wide');
  const draw=()=>{withFocus(m.body,()=>{const n=sel.size;m.body.innerHTML=`
    <p style="margin:0">Estas son las prendas de tu búsqueda (disponibles y vendidas). Desmarca las que <b>no</b> quieras cambiar.</p>
    <div class="row2"><div class="fld"><label for="mm-marca">Marca nueva</label><input id="mm-marca" list="dl-marcas" value="${esc(nueva)}" placeholder="Ej: JORDAN" autocomplete="off"></div>
      <label style="display:flex;gap:8px;align-items:center;font-weight:600;align-self:end;min-height:40px"><input type="checkbox" id="mm-ventas" ${ventasTambien?'checked':''}> Cambiarla también en las ventas ya registradas</label></div>
    <div class="quick"><button class="btn sm" data-a="todas">Marcar todas</button><button class="btn sm" data-a="ninguna">Desmarcar todas</button><span class="hint" style="margin:0;align-self:center">${n} de ${items.length} seleccionadas</span></div>
    <div class="tw" style="max-height:46vh;overflow:auto"><table class="tbl"><tbody>${items.map(i=>`<tr class="click" data-a="tog" data-k="${esc(i.key)}"><td style="width:36px"><input type="checkbox" tabindex="-1" ${sel.has(i.key)?'checked':''} aria-label="Seleccionar"></td><td><div class="thumb">${photoTag(i.foto)}</div></td><td><div class="gold" style="font-size:11px;font-weight:800;letter-spacing:.1em">${esc(i.marca)}</div>${esc(i.articulo)}</td><td>${esc(i.talla)}</td><td class="muted">${esc(i.loteNombre)}</td><td>${i.stock<=0?'<span class="chip bad">Vendida</span>':''}</td></tr>`).join('')}</tbody></table></div>
    ${dlMarcas()}
    <div class="sheet-f"><span class="grow"></span><button class="btn ghost" data-a="cancel">Cancelar</button><button class="btn primary" data-a="ok" ${busy?'disabled':''}>${busy?'Guardando…':`Cambiar ${n} prenda${n===1?'':'s'}`}</button></div>`})};
  draw();
  m.body.addEventListener('input',e=>{if(e.target.id==='mm-marca')nueva=e.target.value});
  m.body.addEventListener('change',e=>{if(e.target.id==='mm-ventas')ventasTambien=e.target.checked});
  m.body.addEventListener('click',async e=>{
    const a=e.target.closest('[data-a]');if(!a)return;const act=a.dataset.a;
    if(act==='tog'){const k=a.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);draw()}
    if(act==='todas'){items.forEach(i=>sel.add(i.key));draw()}
    if(act==='ninguna'){sel.clear();draw()}
    if(act==='cancel')m.close();
    if(act==='ok'){
      const marca=ALIAS_MARCA(nueva.trim().toUpperCase());
      if(!marca){toast('Escribe la marca nueva.','bad');$('#mm-marca',m.body).focus();return}
      if(!sel.size){toast('Selecciona al menos una prenda.','bad');return}
      if(!canWrite()||busy)return;busy=true;draw();
      const porLote=new Map();for(const k of sel){const[l,i]=k.split('|');if(!porLote.has(l))porLote.set(l,new Set());porLote.get(l).add(i)}
      let ok=true,n=0;
      for(const[lid,ids]of porLote){const l=structuredClone(S.lotes.find(x=>x.id===lid));if(!l)continue;
        for(const it of l.items)if(ids.has(it.id)&&it.marca!==marca){it.marca=marca;n++}
        const{id,...data}=l;if(!(await write(()=>db.collection('lotes').doc(id).set(data)))){ok=false;break}}
      let nv=0;
      if(ok&&ventasTambien)for(const v of S.ventas){if(!(v.items||[]).some(i=>sel.has(i.loteId+'|'+i.itemId)&&i.marca!==marca))continue;
        const c=structuredClone(v);c.items.forEach(i=>{if(sel.has(i.loteId+'|'+i.itemId))i.marca=marca});const{id,...data}=c;
        if(!(await write(()=>db.collection('ventas').doc(id).set(data)))){ok=false;break}nv++}
      busy=false;
      if(ok){m.close();toast(`Listo: ${n} prenda(s) ahora son ${marca}${nv?` y se actualizaron ${nv} venta(s)`:''}`,'good')}else draw();
    }
  });
}

async function restaurar(pid,silent){

    const l=structuredClone(l0);if(!l.items.some(x=>x.id===p.data.item.id)){const at=Math.min(p.data.pos??l.items.length,l.items.length);l.items.splice(at,0,structuredClone(p.data.item))}
    finishLote(l);const{id,...data}=l;ok=await write(()=>db.collection('lotes').doc(id).set(data));

async function resizeImage(file,max=1200){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(ok=>c.toBlob(b=>ok(b),'image/jpeg',.85));
  }finally{URL.revokeObjectURL(url)}
}
async function uploadPhoto(file){
  if(!assets)throw{code:'not_granted'};
  let blob=null;try{blob=await resizeImage(file)}catch(e){blob=null}
  if(!blob){if(['image/jpeg','image/png','image/webp','image/gif'].includes(file.type))blob=file;else throw{code:'unsupported_type'}}
  const r=await assets.upload(blob,{type:blob.type||'image/jpeg'});
  return r.id;
}

      <div class="fld" style="grid-column:span 2"><label for="lm-nota">Nota</label><input id="lm-nota" data-l="nota" value="${esc(L.nota)}" placeholder="Opcional"></div>
    </div>
    <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="lm-pag" data-l="pagado" ${L.pagado?'checked':''}> Lo pagué con plata de la caja (se descuenta en la fecha del lote)</label>
    <div class="sheet-f"><h3 class="sub">Prendas del lote</h3><span class="grow"></span><span class="hint" style="margin:0">Costo = US$ × (1 − desc.) × (1 + impuesto) × dólar + envío repartido</span></div>
    <div class="tw"><table class="tbl egrid"><thead><tr><th>Foto</th><th>Marca</th><th>Prenda</th><th>Ref.</th><th>Talla</th><th>Cant.</th><th>US$</th><th>Desc.%</th><th>Precio venta</th><th class="n">Costo c/u</th><th class="n">Ganas c/u</th><th></th></tr></thead><tbody id="lm-rows"></tbody></table></div>
    <div><button class="btn" data-a="add">${ic(IC.plus)}Agregar prenda</button></div>
    <div class="calc-box" id="lm-sum"></div>
    ${dlMarcas()}
    <div class="sheet-f">
      ${orig?`<button class="btn danger" data-a="del">${ic(IC.trash)}Borrar lote</button><button class="btn ghost" data-a="ver-inv">Ver en inventario</button>`:''}
      <span class="grow"></span><button class="btn ghost" data-a="cancel">Cancelar</button><button class="btn primary" data-a="save" id="lm-save">Guardar lote</button>
    </div>`;
  const tb=$('#lm-rows',m.body);
  const drawRows=()=>{withFocus(m.body,()=>{tb.innerHTML=rows.map((r,i)=>`<tr>
      <td>${assets?`<label class="lphoto" for="lr-f-${i}" title="${r.foto?'Cambiar foto':'Agregar foto'}">${r.upl?'<span class="muted">…</span>':r.foto?`<img src="${blobUrl(r.foto)}" alt="">${(r.fotosExtra||[]).length?`<span class="lp-n">+${r.fotosExtra.length}</span>`:''}`:ic(IC.cam)}<span class="sr">${r.foto?'Cambiar foto':'Agregar foto'}</span></label><input type="file" accept="image/*" id="lr-f-${i}" data-foto="${i}" class="sr">`:`<span class="lphoto" title="Fotos no disponibles en esta vista">${ic(IC.cam)}</span>`}</td>
      <td><input class="w-marca" id="lr-m-${i}" data-r="${i}" data-k="marca" list="dl-marcas" value="${esc(r.marca)}" aria-label="Marca"></td>
      <td><input class="w-art" id="lr-a-${i}" data-r="${i}" data-k="articulo" value="${esc(r.articulo)}" aria-label="Prenda" placeholder="Camiseta negra logo…"></td>
      <td><input class="w-ref" id="lr-r-${i}" data-r="${i}" data-k="ref" value="${esc(r.ref)}" aria-label="Referencia"></td>
      <td><input class="w-talla" id="lr-t-${i}" data-r="${i}" data-k="talla" list="dl-tallas" value="${esc(r.talla)}" aria-label="Talla"></td>
      <td><input class="w-cant" id="lr-c-${i}" data-r="${i}" data-k="cant" inputmode="numeric" value="${esc(r.cant)}" aria-label="Cantidad"></td>
      <td><input class="w-usd" id="lr-u-${i}" data-r="${i}" data-k="usd" inputmode="decimal" value="${esc(r.usd)}" aria-label="Precio en dólares" placeholder="0,00"></td>
      <td><input class="w-desc" id="lr-d-${i}" data-r="${i}" data-k="desc" inputmode="decimal" value="${esc(r.desc)}" aria-label="Descuento" placeholder="0"></td>
      <td><input class="w-precio" id="lr-p-${i}" data-r="${i}" data-k="precio" data-money inputmode="numeric" value="${esc(r.precio)}" aria-label="Precio de venta"></td>
      <td class="calc n" id="lr-co-${i}"></td><td class="calc n" id="lr-g-${i}"></td>
      <td style="white-space:nowrap"><button class="icon-btn" data-a="dup" data-i="${i}" aria-label="Duplicar para otra talla" title="Duplicar para otra talla">${ic(IC.copy)}</button><button class="icon-btn" data-a="rm" data-i="${i}" aria-label="Quitar" ${r.sold?'disabled title="Ya tiene ventas"':''}>${ic(IC.trash)}</button></td></tr>`).join('')});calc()};
  const calc=()=>{
    const c=calcLote(L,rows);const aum=parseNum(L.aumento);
    let venta=0;
    rows.forEach((r,i)=>{
      const costo=c.costos[i]||0;const pv=r.precio.trim()?parseNum(r.precio):sugerido(costo,aum);venta+=pv*(Math.round(parseNum(r.cant))||0);
      const co=$('#lr-co-'+i,m.body),g=$('#lr-g-'+i,m.body),pi=$('#lr-p-'+i,m.body);
      if(co)co.textContent=cop(costo);if(g){g.textContent=pv?cop(pv-costo):'—';g.className='calc n '+(pv-costo>=0?'good':'bad')}
      if(pi)pi.placeholder=aum?int(sugerido(costo,aum)):'0';
    });
    $('#lm-sum',m.body).innerHTML=`<div><span>Prendas</span><b>${int(c.uni)}</b></div><div><span>Total en dólares</span><b>${usd(c.totNeto)}</b></div><div><span>Mercancía en pesos (+${esc(L.impPct||0)}%)</span><b>${cop(c.merc)}</b></div><div><span>Envío y otros</span><b>${cop(c.extras)}</b></div><div><span>Total del lote</span><b class="gold">${cop(c.total)}</b></div><div><span>Si vendes todo</span><b>${cop(venta)}</b></div><div><span>Ganancia esperada</span><b class="good">${cop(venta-c.total)}</b></div>`;
  };
  drawRows();
  m.body.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.l){L[t.dataset.l]=t.type==='checkbox'?t.checked:t.value;calc()}
    else if(t.dataset.r!=null){rows[+t.dataset.r][t.dataset.k]=t.value;calc()}
  });
  m.body.addEventListener('change',async e=>{const t=e.target;
    if(t.dataset.foto!=null&&t.files&&t.files[0]){const r=rows[+t.dataset.foto];r.upl=true;drawRows();
      try{r.foto=await uploadPhoto(t.files[0]);toast('Foto lista. Se guarda al guardar el lote.','good')}catch(err){toast(photoErr(err),'bad')}
      r.upl=false;drawRows();return}
    if(t.dataset.l){L[t.dataset.l]=t.type==='checkbox'?t.checked:t.value;calc()}});
  m.body.addEventListener('click',async e=>{
    const a=e.target.closest('[data-a]');if(!a)return;const act=a.dataset.a;
    if(act==='add'){rows.push(newRow());drawRows();const n=$(`#lr-m-${rows.length-1}`,m.body);n&&n.focus()}
    if(act==='dup'){const i=+a.dataset.i;rows.splice(i+1,0,newRow(rows[i]));drawRows();const n=$(`#lr-t-${i+1}`,m.body);n&&n.focus()}
    if(act==='rm'){rows.splice(+a.dataset.i,1);if(!rows.length)rows.push(newRow());drawRows()}
    if(act==='cancel')m.close();
    if(act==='ver-inv'){m.close();S.inv={...S.inv,lote:orig.id,estado:'todas',q:'',marca:'',talla:''};location.hash='inventario';paint()}
    if(act==='del'){
      const used=S.ventas.some(v=>(v.items||[]).some(i=>i.loteId===orig.id));
      if(used){toast('Este lote tiene ventas registradas. Borra esas ventas primero.','bad');return}
      if(!(await confirmBox(`¿Borrar el lote <b>${esc(orig.nombre)}</b> con sus ${rows.length} prendas? Quedará ${DIAS_PAPELERA} días en la papelera.`)))return;
      if(!canWrite())return;
      const lo=structuredClone(S.lotes.find(l=>l.id===orig.id));const pid=await aPapelera('lote',lo,`Lote ${lo.nombre}`);if(!pid)return;
      if(await write(()=>db.collection('lotes').doc(orig.id).delete())){m.close();toastAction('Lote enviado a la papelera','Deshacer',()=>restaurar(pid))}
    }
    if(act==='save'){
      if(busy||!canWrite())return;
      if(!L.nombre.trim()){toast('Ponle un nombre al lote.','bad');$('#lm-nombre',m.body).focus();return}
      if(parseNum(L.dolar)<=0){toast('Escribe el valor del dólar.','bad');$('#lm-dolar',m.body).focus();return}
      const keep=rows.filter(r=>r.articulo.trim()||r.marca.trim()||parseNum(r.usd)>0||r.sold);
      if(!keep.length){toast('Agrega al menos una prenda.','bad');return}
      for(const r of keep){
        if(!r.articulo.trim()){toast('A una prenda le falta el nombre.','bad');return}
        const c=Math.round(parseNum(r.cant));if(c<1){toast(`Revisa la cantidad de ${r.articulo}.`,'bad');return}
        if(c<r.sold){toast(`${r.articulo}: la cantidad no puede ser menor que lo vendido (${r.sold}).`,'bad');return}
      }
      const aum=parseNum(L.aumento);
      const doc={nombre:L.nombre.trim(),fecha:L.fecha||'',proveedor:L.proveedor.trim(),dolar:parseNum(L.dolar),impPct:parseNum(L.impPct),envio:parseNum(L.envio),envioMon:L.envioMon,otrosCOP:Math.round(parseNum(L.otrosCOP)),reparto:L.reparto,aumento:Math.round(aum),pagado:!!L.pagado,nota:L.nota.trim(),
        importado:orig?!!orig.importado:false,creado:orig?(orig.creado||Date.now()):Date.now(),actualizado:Date.now(),
        items:keep.map(r=>({id:r.id,marca:r.marca.trim().toUpperCase(),articulo:r.articulo.trim(),ref:r.ref.trim(),talla:(r.talla.trim()||'ÚNICA').toUpperCase(),cant:Math.round(parseNum(r.cant)),usd:parseNum(r.usd),desc:parseNum(r.desc),precio:0,foto:r.foto||null,fotosExtra:r.fotosExtra||[],prevVend:r.prevVend||0,prevCliente:r.prevCliente||''}))};
      finishLote(doc);
      doc.items.forEach((it,i)=>{const r=keep[i];it.precio=Math.round(r.precio.trim()?parseNum(r.precio):sugerido(it.costo,aum))});
      if(JSON.stringify(doc).length>240000){toast('El lote tiene demasiadas prendas. Divídelo en dos lotes.','bad');return}
      busy=true;$('#lm-save',m.body).disabled=true;$('#lm-save',m.body).textContent='Guardando…';
      const lid=orig?orig.id:newId('lotes');
      const quitados=orig?(S.lotes.find(l=>l.id===orig.id)||orig).items.map((it,pos)=>({it,pos})).filter(x=>!keep.some(r=>r.id===x.it.id)):[];
      for(const q of quitados){if(!(await aPapelera('prenda',{loteId:lid,loteNombre:doc.nombre,pos:q.pos,item:structuredClone(q.it)},`${q.it.marca?q.it.marca+' · ':''}${q.it.articulo} (${q.it.talla})`))){busy=false;$('#lm-save',m.body).disabled=false;$('#lm-save',m.body).textContent='Guardar lote';return}}
      const ok=await write(()=>db.collection('lotes').doc(lid).set(doc));
      busy=false;
      if(ok){
        m.close();toast(orig?(quitados.length?`Lote actualizado. ${quitados.length} prenda(s) quitada(s) quedaron en la papelera.`:'Lote actualizado'):`Lote guardado: ${doc.unidades} prendas al inventario`,'good');
        const patch={};if(doc.dolar!==S.config.dolar)patch.dolar=doc.dolar;if(doc.impPct!==S.config.impPct)patch.impPct=doc.impPct;if(aum&&aum!==S.config.aumento)patch.aumento=aum;
        if(Object.keys(patch).length)saveConfig(patch);
      }else{$('#lm-save',m.body).disabled=false;$('#lm-save',m.body).textContent='Guardar lote'}
    }
  });
}

/* Venta */
function ventaModal(preKeys=[]){
  const st={q:'',fecha:hoy(),nombre:'',cc:'',tel:'',pago:'contado',abono:'',metodo:'Efectivo',canal:'Tienda',descuento:'',nota:'',cart:[]};
  const addKey=k=>{const it=D.byKey.get(k);if(!it||it.stock<=0)return false;const c=st.cart.find(x=>x.key===k);if(c){if(c.cant>=it.stock){toast(`Solo hay ${it.stock} de esa prenda.`,'bad');return false}c.cant++}else st.cart.push({key:k,cant:1,precio:it.precio?int(it.precio):''});return true};
  preKeys.forEach(addKey);
  const m=openModal(`Nueva venta · factura #${D.nextFactura}`,'wide');let busy=false;
  const clientes=[...D.clientes.values()];
  m.body.innerHTML=`<div class="vm">
    <section style="display:flex;flex-direction:column;gap:10px">
      <div class="fld"><label for="vm-q">Buscar prenda disponible</label><input id="vm-q" type="search" placeholder="Marca, prenda, talla o referencia" autocomplete="off"></div>
      <div class="vm-list" id="vm-list"></div>

    <section style="display:flex;flex-direction:column;gap:12px">
      <h3 class="sub">Cliente</h3>
      <div class="fld"><label for="vm-nom">Nombre</label><input id="vm-nom" data-v="nombre" list="dl-cli" placeholder="Nombre del cliente (opcional)" autocomplete="off"><datalist id="dl-cli">${clientes.map(c=>`<option value="${esc(c.nombre)}">`).join('')}</datalist></div>
      <div class="row2"><div class="fld"><label for="vm-cc">Cédula / NIT</label><input id="vm-cc" data-v="cc" inputmode="numeric"></div><div class="fld"><label for="vm-tel">Teléfono</label><input id="vm-tel" data-v="tel" inputmode="tel"></div></div>
      <h3 class="sub">Prendas</h3>
      <div id="vm-cart"></div>
      <div class="row2"><div class="fld"><label for="vm-desc">Descuento (COP)</label><input id="vm-desc" data-v="descuento" data-money inputmode="numeric" placeholder="0"></div><div class="fld"><label for="vm-fecha">Fecha</label><input id="vm-fecha" type="date" data-v="fecha" value="${st.fecha}"></div></div>
      <div class="tot" id="vm-tot"></div>
      <h3 class="sub">Pago</h3>
      <div class="radio-row"><label><input type="radio" name="vm-pago" value="contado" checked> Pagó todo</label><label><input type="radio" name="vm-pago" value="credito"> Separado / con abonos</label></div>
      <div class="row2"><div class="fld" id="vm-ab-w" hidden><label for="vm-ab">Abono de hoy (COP)</label><input id="vm-ab" data-v="abono" data-money inputmode="numeric" placeholder="0"></div>
        <div class="fld"><label for="vm-met">Medio de pago</label><select id="vm-met" data-v="metodo">${METODOS.map(x=>`<option>${x}</option>`).join('')}</select></div></div>
      <div class="row2"><div class="fld"><label for="vm-can">Vendido por</label><select id="vm-can" data-v="canal">${CANALES.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="fld"><label for="vm-nota">Nota</label><input id="vm-nota" data-v="nota" placeholder="Opcional"></div></div>
      <div class="sheet-f"><span class="grow"></span><button class="btn ghost" data-a="cancel">Cancelar</button><button class="btn primary" data-a="save" id="vm-save">Guardar venta</button></div>
    </section></div>`;
  const drawList=()=>{
    const q=norm(st.q);
    const list=D.disp.filter(i=>!q||norm(`${i.marca} ${i.articulo} ${i.talla} ${i.ref}`).includes(q)).slice(0,80);
    $('#vm-list',m.body).innerHTML=list.length?`<div class="list">${list.map(i=>{const inCart=(st.cart.find(c=>c.key===i.key)||{}).cant||0;return `<button class="li" style="padding:9px 10px" data-a="add" data-k="${esc(i.key)}" ${inCart>=i.stock?'disabled':''}><div class="thumb">${photoTag(i.foto)}</div><div style="min-width:0"><div class="m gold" style="font-weight:800;letter-spacing:.08em">${esc(i.marca)}</div><div class="t" style="font-size:14px">${esc(i.articulo)}</div><div class="m">Talla ${esc(i.talla)}${i.ref?' · '+esc(i.ref):''}${i.stock>1?` · ${i.stock} disp.`:''}</div></div><div class="r num"><b>${cop(i.precio)}</b>${inCart?`<div class="m good">En la venta</div>`:''}</div></button>`}).join('')}</div>`:`<div class="empty">${D.disp.length?'Nada coincide.':'No hay prendas disponibles.'}</div>`;
  };
  const totals=()=>{
    let sub=0,costo=0;
    for(const c of st.cart){const it=D.byKey.get(c.key);if(!it)continue;sub+=c.cant*parseNum(c.precio);costo+=c.cant*(it.costo||0)}
    const desc=Math.min(sub,parseNum(st.descuento));const total=sub-desc;
    const ab=st.pago==='contado'?total:Math.min(total,parseNum(st.abono));
    return{sub,desc,total,costo,gan:total-costo,ab,saldo:total-ab};
  };
  const drawTot=()=>{const t=totals();
    $('#vm-tot',m.body).innerHTML=`<div><span class="muted">Subtotal</span><span class="num">${cop(t.sub)}</span></div>${t.desc?`<div><span class="muted">Descuento</span><span class="num">− ${cop(t.desc)}</span></div>`:''}<div><span>Total a pagar</span><span class="big num">${cop(t.total)}</span></div><div><span class="muted">Ganancia</span><span class="num ${t.gan>=0?'good':'bad'}">${cop(t.gan)}</span></div>${st.pago==='credito'?`<div><span class="muted">Queda debiendo</span><span class="num warn">${cop(t.saldo)}</span></div>`:''}`;
    $('#vm-save',m.body).disabled=!st.cart.length||busy;
    st.cart.forEach((c,i)=>{const e=$('#vm-sub-'+i,m.body);if(e)e.textContent=cop(c.cant*parseNum(c.precio))});
  };
  const drawCart=()=>{withFocus(m.body,()=>{$('#vm-cart',m.body).innerHTML=st.cart.length?st.cart.map((c,i)=>{const it=D.byKey.get(c.key)||{};return `<div class="cart-line">
      <div style="display:flex;gap:10px;min-width:0"><div class="thumb">${photoTag(it.foto)}</div><div style="min-width:0"><div class="t" style="font-weight:600">${esc(it.articulo||'Prenda')}</div><div class="m muted" style="font-size:12.5px">${esc(it.marca||'')} · Talla ${esc(it.talla||'')} · costo ${cop(it.costo)}</div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:6px"><span class="stepper"><button data-a="dec" data-i="${i}" aria-label="Menos">−</button><span>${c.cant}</span><button data-a="inc" data-i="${i}" aria-label="Más">+</button></span><input id="vm-p-${i}" data-ci="${i}" data-money inputmode="numeric" value="${esc(c.precio)}" style="width:130px" aria-label="Precio unitario"></div></div></div>
      <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px"><b class="num" id="vm-sub-${i}"></b><button class="icon-btn" data-a="rm" data-i="${i}" aria-label="Quitar">${ic(IC.trash)}</button></div></div>`}).join(''):`<p class="hint" style="margin:0">Toca una prenda de la lista para agregarla.</p>`});drawTot()};
  drawList();drawCart();
  m.onData=()=>{st.cart=st.cart.filter(c=>D.byKey.get(c.key));drawList();drawCart();m.setTitle(`Nueva venta · factura #${D.nextFactura}`)};
  m.body.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='vm-q'){st.q=t.value;drawList();return}
    if(t.dataset.ci!=null){st.cart[+t.dataset.ci].precio=t.value;drawTot();return}
    if(t.dataset.v){st[t.dataset.v]=t.value;
      if(t.dataset.v==='nombre'){const c=D.clientes.get(norm(t.value));if(c){if(!st.cc&&c.cc){st.cc=c.cc;$('#vm-cc',m.body).value=c.cc}if(!st.tel&&c.tel){st.tel=c.tel;$('#vm-tel',m.body).value=c.tel}}}
      drawTot()}
  });
  m.body.addEventListener('change',e=>{const t=e.target;if(t.name==='vm-pago'){st.pago=t.value;$('#vm-ab-w',m.body).hidden=st.pago!=='credito';drawTot()}else if(t.dataset.v){st[t.dataset.v]=t.value;drawTot()}});
  m.body.addEventListener('click',async e=>{
    const a=e.target.closest('[data-a]');if(!a)return;const act=a.dataset.a;
    if(act==='add'){if(addKey(a.dataset.k)){drawList();drawCart()}}
    if(act==='inc'||act==='dec'){const c=st.cart[+a.dataset.i];const it=D.byKey.get(c.key);if(act==='inc'){if(c.cant>=it.stock){toast(`Solo hay ${it.stock} de esa prenda.`,'bad');return}c.cant++}else if(c.cant>1)c.cant--;drawList();drawCart()}
    if(act==='rm'){st.cart.splice(+a.dataset.i,1);drawList();drawCart()}
    if(act==='cancel')m.close();
    if(act==='save'){
      if(busy||!canWrite())return;
      if(!st.cart.length){toast('Agrega al menos una prenda.','bad');return}
      for(const c of st.cart){const it=D.byKey.get(c.key);if(!it||c.cant>it.stock){toast(`No hay suficiente stock de ${it?it.articulo:'una prenda'}.`,'bad');return}if(parseNum(c.precio)<=0){toast(`Ponle precio a ${it.articulo}.`,'bad');return}}
      const t=totals();
      if(st.pago==='credito'&&!st.nombre.trim()){toast('Para vender a crédito escribe el nombre del cliente.','bad');$('#vm-nom',m.body).focus();return}
      const items=st.cart.map(c=>{const it=D.byKey.get(c.key);return{loteId:it.loteId,itemId:it.id,desc:it.articulo,marca:it.marca,talla:it.talla,ref:it.ref||'',cant:c.cant,precio:Math.round(parseNum(c.precio)),costo:it.costo||0}});
      const ts=Date.now();

document.addEventListener('change',e=>{const t=e.target;if(t.matches&&t.matches('[data-import]')&&t.files&&t.files[0]){const f=t.files[0];t.value='';importJson(f)}});
document.addEventListener('focusout',e=>{if(!e.target.closest||e.target.closest('.overlay'))return;moneyBlur(e);const t=e.target;if(t.dataset&&t.dataset.cj==='monto')S.cajaForm.monto=t.value});
